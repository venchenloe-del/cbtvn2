<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CBT</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script><style>body{font-family:Inter,system-ui,sans-serif}.menu-btn{transition:all .15s ease}.nav-drawer{position:fixed;top:0;left:0;bottom:0;width:280px;background:#fff;border-right:1px solid #e2e8f0;z-index:50;transform:translateX(-100%);transition:transform .2s ease;overflow-y:auto}.nav-drawer.open{transform:translateX(0)}.drawer-overlay{position:fixed;inset:0;background:#0f172a66;z-index:40;display:none}.drawer-overlay.show{display:block}.drawer-brand{padding:18px;border-bottom:1px solid #e2e8f0}.drawer-section{padding:14px 12px 4px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:#64748b}.drawer-item{display:flex;align-items:center;gap:10px;width:100%;padding:10px 14px;margin:2px 0;border-radius:10px;text-align:left;font-weight:600;color:#334155;background:transparent;border:0;cursor:pointer}.drawer-item:hover{background:#f1f5f9}.drawer-item.active{background:#e0f2fe;color:#075985}.drawer-sub{padding-left:18px}.drawer-toggle{border:1px solid #e2e8f0;background:#fff;border-radius:10px;padding:8px 10px;cursor:pointer}.staff-layout{display:flex;min-height:calc(100vh - 73px)}.staff-main{flex:1;min-width:0}.desktop-drawer{position:sticky;top:73px;height:calc(100vh - 73px);transform:none;flex-shrink:0}.desktop-overlay{display:none!important}.drawer-close{display:none}.drawer-mobile-toggle{display:none}@media(max-width:900px){.desktop-drawer{position:fixed;top:0;height:100vh;transform:translateX(-100%)}.desktop-drawer.open{transform:translateX(0)}.drawer-close{display:block}.drawer-mobile-toggle{display:block}.staff-main{width:100%}}.menu-btn.active{background:#bae6fd!important;color:#075985!important;border-color:#7dd3fc!important;box-shadow:0 1px 2px #0001}.menu-btn:not(.active){background:#fff;border:1px solid #e2e8f0;color:#334155}.card{background:white;border:1px solid #e5e7eb;border-radius:18px;box-shadow:0 8px 25px #0001}.opt{border:1px solid #d1d5db;border-radius:12px;padding:12px;text-align:left;width:100%}.opt.sel{border-color:#2563eb;background:#eff6ff}.danger{color:#dc2626}.password-wrap{position:relative}.password-wrap input{padding-right:48px}.exam-fullscreen{background:#f8fafc!important}.question-nav{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:8px}.question-nav button{min-height:40px;border-radius:10px;font-weight:700;border:1px solid #cbd5e1;background:white;color:#475569}.question-nav button.done{background:#dcfce7;border-color:#86efac;color:#166534}.question-nav button.current{outline:3px solid #bae6fd;border-color:#0284c7}.question-nav button.done.current{background:#bbf7d0}.exam-fullscreen .card{box-shadow:0 8px 30px #0001}.by-ven-loe{display:block;text-align:center;margin-top:10px;font-size:13px;font-weight:700;letter-spacing:.08em;color:#0284c7;white-space:nowrap;overflow:hidden;animation:venloeMarquee 7s linear infinite}@keyframes venloeMarquee{0%{transform:translateX(35%);opacity:.2}15%{opacity:1}85%{opacity:1}100%{transform:translateX(-35%);opacity:.2}}.password-toggle{position:absolute;right:10px;top:50%;transform:translateY(-50%);border:0;background:transparent;cursor:pointer;font-size:20px}@media print{.no-print{display:none!important}.print-area{display:block!important}}</style></head><body class="bg-slate-50 text-slate-800"><header class="bg-white border-b sticky top-0 z-30"><div class="max-w-7xl mx-auto p-3 flex justify-between items-center gap-3"><div class="flex items-center gap-3"><button id="drawerToggle" class="drawer-toggle drawer-mobile-toggle" onclick="toggleDrawer()" aria-label="Buka menu">☰</button><div><b id="school">CBT</b><div class="text-xs text-slate-500" id="appname">Portal CBT</div></div></div><div id="who"></div></div></header><div id="drawerOverlay" class="drawer-overlay" onclick="closeDrawer()"></div><main class="max-w-7xl mx-auto p-4">
<section id="login" class="max-w-md mx-auto mt-8 card p-6"><h1 class="text-2xl font-bold">Login CBT</h1><p class="text-sm text-slate-500 mb-5">Login dapat menggunakan username, NIS, atau NISN sesuai akun.</p><input id="user" class="w-full border rounded-xl p-3 mb-3" placeholder="NIS / NISN / Username"><div class="password-wrap mb-4"><input id="pass" type="password" class="w-full border rounded-xl p-3" placeholder="Password"><button type="button" class="password-toggle" onclick="togglePassword('pass','eyeLogin')" aria-label="Tampilkan password"><span id="eyeLogin">👁️</span></button></div><button onclick="login()" class="w-full bg-blue-600 text-white rounded-xl p-3 font-semibold">Masuk</button><div class="by-ven-loe">✦  B Y &nbsp; V E N &nbsp; L O E  &nbsp; ✦</div><div class="text-xs text-slate-500 mt-4">SMAN 2 KUTENG</div></section>
<section id="student" class="hidden"><div class="flex justify-between items-center mb-4"><div><h2 class="text-2xl font-bold">Portal Siswa</h2><p id="sinfo" class="text-sm text-slate-500"></p></div><div id="timer" class="font-mono font-bold text-red-600 text-xl"></div></div><div id="studentContent"></div></section>
<section id="staff" class="hidden -mx-4 -mt-4"><div class="staff-layout"><aside id="staffDrawer" class="nav-drawer desktop-drawer no-print"><div class="drawer-brand flex items-center justify-between"><div><div class="font-bold text-lg">Menu CBT</div><div id="drawerRole" class="text-xs text-slate-500"></div></div><button class="drawer-toggle drawer-close" onclick="closeDrawer()">✕</button></div><div id="staffNav"></div></aside><div class="staff-main p-4"><div id="staffContent"></div></div></div></section>
</main><script>
let me=null,exam=null,idx=0,ans={},timer=null,examStatusTimer=null,questionCache=[],editingQuestionId=null,currentQuestionImage='',antiCheatActive=false,violationBusy=false,finishDialogOpen=false,returningToLogin=false;
const $=x=>document.getElementById(x);
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function api(u,o={}){let r=await fetch(u,{...o,headers:{'Content-Type':'application/json',...(o.headers||{})}});let d={};try{d=await r.json()}catch{}if(!r.ok){let msg=d.error||d.message||'Error';if(d.details)msg+=`\n${d.details}`;throw Object.assign(Error(msg),{details:d.details,status:r.status})}return d}
let staffHeartbeat=null;
async function boot(){let c=await api('/api/config');$('school').textContent=c.school_name;$('appname').textContent=c.app_name}
function startStaffHeartbeat(){clearInterval(staffHeartbeat);staffHeartbeat=setInterval(async()=>{if(!me||!['admin','guru'].includes(me.role))return;try{await api('/api/me')}catch(e){if(e.status===401){clearInterval(staffHeartbeat);staffHeartbeat=null;}}},5*60*1000)}
function togglePassword(id,eye){const el=$(id),e=$(eye);el.type=el.type==='password'?'text':'password';e.textContent=el.type==='password'?'👁️':'🙈'}
async function login(){try{me=(await api('/api/login',{method:'POST',body:JSON.stringify({username:$('user').value,password:$('pass').value})})).user;$('login').classList.add('hidden');$('who').innerHTML=`${esc(me.name)} <span class="text-xs text-slate-500">(${esc(me.role)})</span> <button onclick="logout()" class="text-red-600 ml-2">Keluar</button>`;if(me.role==='siswa'){$('student').classList.remove('hidden');$('sinfo').textContent=`${me.nis||''}${me.nisn?' · NISN '+me.nisn:''} · ${me.class_name||''}`;studentHome()}else{$('staff').classList.remove('hidden');buildNav();staffTab('dash');startStaffHeartbeat()}}catch(e){Swal.fire('Login gagal',e.message,'error')}}
async function logout(){antiCheatActive=false;stopExamStatusWatch();clearInterval(staffHeartbeat);staffHeartbeat=null;try{if(document.fullscreenElement)await document.exitFullscreen()}catch(e){}await api('/api/logout',{method:'POST'});location.reload()}
function buildNav(){
  const adminOnly=me.role==='admin';
  const item=(id,label,icon='•',extra='')=>`<button id="menu-${id}" data-menu="${id}" onclick="staffTab('${id}');closeDrawer()" class="drawer-item ${extra}"><span class="w-5 text-center">${icon}</span><span>${label}</span></button>`;
  let html=`${item('dash','Dashboard','🏠')}
    <div class="drawer-section">Data</div>
    ${adminOnly?item('settings','Identitas','🏫'):''}
    ${adminOnly?item('admins','Admin','🔐'):''}
    ${adminOnly?item('gurus','Guru','👨‍🏫'):''}
    ${item('students','Data Siswa','👨‍🎓')}
    ${item('subjects','Mata Pelajaran','📚')}
    <div class="drawer-section mt-2">Ujian</div>
    ${item('questions','Bank Soal','📝')}
    ${item('schedule','Jadwal','📅')}
    ${item('results','Nilai','📊')}
    ${item('cards','Kartu Login','🪪')}
    ${adminOnly?item('cbtreset','Reset CBT','🔄'):''}`;
  $('staffNav').innerHTML=html;
  $('drawerRole').textContent=`${me.name} · ${me.role==='admin'?'Administrator':'Guru'}`;
  $('drawerToggle').classList.add('drawer-mobile-toggle');
}
function toggleDrawer(){const d=$('staffDrawer');const o=$('drawerOverlay');d.classList.toggle('open');o.classList.toggle('show')}
function closeDrawer(){const d=$('staffDrawer');const o=$('drawerOverlay');d.classList.remove('open');o.classList.remove('show')}

async function studentHome(){antiCheatActive=false;document.body.classList.remove('exam-fullscreen');let x=await api('/api/student/exams');$('studentContent').innerHTML=`<div class="grid md:grid-cols-2 gap-4">${x.map(e=>{let locked=['violation','stopped'].includes(e.attempt_status)||me?.cbt_locked;let st=locked?'Dikunci Admin':Date.now()<e.start_at?'Belum mulai':Date.now()>e.end_at?'Ditutup':e.finished_at&&!e.allow_repeat?'Selesai':e.attempt_id&&!e.finished_at?'Lanjutkan':'Tersedia';return `<div class="card p-5"><div class="text-sm text-slate-500">${esc(e.code)}</div><h3 class="font-bold text-lg">${esc(e.name)}</h3><p>${esc(e.subject_name)} · ${e.duration_minutes||''} menit</p><p class="text-xs text-slate-500 mt-2">${new Date(e.start_at).toLocaleString('id-ID')} s/d ${new Date(e.end_at).toLocaleString('id-ID')}</p><button ${locked||!['Tersedia','Lanjutkan'].includes(st)?'disabled':''} onclick="start(${e.id})" class="mt-4 w-full rounded-xl p-3 ${locked?'bg-red-100 text-red-700':st==='Tersedia'||st==='Lanjutkan'?'bg-blue-600 text-white':'bg-slate-200'}">${st}</button></div>`}).join('')||'<div class="card p-6">Belum ada jadwal ujian.</div>'}</div>`}
async function start(id){try{if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{});exam=await api('/api/exams/start',{method:'POST',body:JSON.stringify({schedule_id:id})});idx=0;ans=exam.answers&&typeof exam.answers==='object'?exam.answers:{};antiCheatActive=true;document.body.classList.add('exam-fullscreen');draw();runTimer();watchExamStatus()}catch(e){Swal.fire('Tidak dapat mulai',e.message,'error')}}
function stopExamStatusWatch(){clearInterval(examStatusTimer);examStatusTimer=null}
function watchExamStatus(){stopExamStatusWatch();if(!exam?.attempt_id)return;examStatusTimer=setInterval(async()=>{if(!exam?.attempt_id||returningToLogin)return;try{const rows=await api('/api/student/exams');const current=rows.find(x=>Number(x.attempt_id)===Number(exam.attempt_id)||Number(x.id)===Number(exam.exam?.id));if(current&&(current.attempt_status==='stopped'||current.attempt_status==='violation'||current.cbt_locked)){await forceReturnToLogin(current.attempt_status==='violation'?'Sesi ujian dihentikan karena pelanggaran.':'Ujian dihentikan oleh admin.');}}catch(e){}},2000)}
async function forceReturnToLogin(message){if(returningToLogin)return;returningToLogin=true;antiCheatActive=false;clearInterval(timer);stopExamStatusWatch();exam=null;ans={};document.body.classList.remove('exam-fullscreen');try{if(document.fullscreenElement)await document.exitFullscreen()}catch(e){}try{await api('/api/logout',{method:'POST'})}catch(e){}await Swal.fire({icon:'warning',title:'Ujian Dihentikan',text:message+' Anda akan dikembalikan ke menu login.',timer:2200,timerProgressBar:true,showConfirmButton:false});location.reload()}
function runTimer(){clearInterval(timer);timer=setInterval(()=>{let left=Math.max(0,exam.expires_at-Date.now()),s=Math.floor(left/1000),m=Math.floor(s/60),ss=s%60;$('timer').textContent=`${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}`;if(left<=0){clearInterval(timer);submit(true)}},500)}
function isAnswered(q){const a=ans[q.id];if(q.type==='essay')return typeof a==='string'&&a.trim().length>0;return q.type==='multi'?Array.isArray(a)&&a.length>0:(typeof a==='number'&&Number.isInteger(a))}
async function goToQuestion(i){if(!exam)return;if(i<0||i>=exam.questions.length)return;const q=exam.questions[idx];if(q?.type==='essay')ans[q.id]=$('essayAnswer')?.value||'';try{await persistAnswers();idx=i;draw()}catch(e){Swal.fire('Gagal menyimpan',e.message,'error')}}
function renderQuestionNavigator(){return `<div class="mt-5 border-t pt-4"><div class="flex flex-wrap items-center justify-between gap-2 mb-3"><div><b>Daftar Nomor Soal</b><div class="text-xs text-slate-500">Hijau = sudah dijawab · putih = belum dijawab · biru = soal aktif</div></div><div class="text-sm font-semibold">${exam.questions.filter(isAnswered).length}/${exam.questions.length} terjawab</div></div><div class="question-nav">${exam.questions.map((qq,i)=>`<button type="button" class="${isAnswered(qq)?'done ':''}${i===idx?'current':''}" onclick="goToQuestion(${i})" title="${isAnswered(qq)?'Sudah dijawab':'Belum dijawab'}">${i+1}</button>`).join('')}</div></div>`}
function draw(){let q=exam.questions[idx],a=ans[q.id];if(q.type==='essay'){const media=q.image_path?`<div class="my-5"><img src="${esc(q.image_path)}" class="max-h-80 max-w-full mx-auto rounded-2xl border object-contain" alt="Gambar soal"></div>`:'';$('studentContent').innerHTML=`<div class="card p-5"><div class="flex flex-wrap justify-between gap-2"><div><b>Soal ${idx+1}/${exam.questions.length}</b><div class="text-xs text-slate-500 mt-1">${isAnswered(q)?'Sudah dijawab':'Belum dijawab'}</div></div><span class="text-xs px-2 py-1 rounded-full bg-amber-50 text-amber-800">Esai / Uraian</span></div><div class="text-lg my-6 whitespace-pre-wrap">${esc(q.text)}</div>${media}<div class="text-sm text-slate-600 bg-amber-50 border border-amber-100 rounded-xl p-3 mb-3">Tulis jawaban dengan lengkap. Jawaban esai akan diperiksa dan dinilai oleh guru.</div><textarea id="essayAnswer" class="w-full border rounded-xl p-3 min-h-48" placeholder="Ketik jawaban kamu di sini...">${esc(typeof a==='string'?a:'')}</textarea><div class="text-xs text-slate-500 mt-2">Jawaban disimpan saat menekan Berikutnya, Sebelumnya, berpindah nomor, atau Selesai.</div><div class="flex flex-wrap justify-between gap-2 mt-6"><button onclick="prev()" ${idx===0?'disabled':''} class="px-4 py-2 bg-slate-200 rounded-xl disabled:opacity-40">Sebelumnya</button><div class="flex gap-2">${idx<exam.questions.length-1?`<button onclick="saveEssayAndNext()" class="px-4 py-2 bg-blue-600 text-white rounded-xl">Berikutnya</button>`:''}${idx===exam.questions.length-1?'<button onclick="submit(false)" class="px-4 py-2 bg-emerald-600 text-white rounded-xl">Selesai</button>':''}</div></div>${renderQuestionNavigator()}</div>`;return}let selected=Array.isArray(a)?a.map(Number):typeof a==='number'?[a]:[];let maxMulti=Number(q.correct_count)||1;let os=q.options.map((o,i)=>{const text=typeof o==='string'?o:(o?.text||'');const image=typeof o==='object'?(o?.image_path||''):'';const original=Number(o.original);const checked=selected.includes(original);const disabled=q.type==='multi'&&!checked&&selected.length>=maxMulti;return `<label class="opt ${checked?'sel':''} ${disabled?'opacity-60 cursor-not-allowed':''}"><div class="flex gap-3 items-start"><input type="checkbox" class="mt-1 h-5 w-5 shrink-0" ${checked?'checked':''} ${disabled?'disabled':''} onchange="pick(${original},this.checked)" aria-label="Pilihan ${String.fromCharCode(65+i)}"><div class="min-w-0 flex-1"><div><b>${String.fromCharCode(65+i)}.</b> ${esc(text)}</div>${image?`<img src="${esc(image)}" class="mt-2 max-h-44 max-w-full rounded-lg border object-contain bg-white" alt="Gambar pilihan ${String.fromCharCode(65+i)}" onerror="this.style.display='none'">`:''}</div></div></label>`}).join('');let hint=q.type==='multi'?`<div class="text-sm text-blue-700 bg-blue-50 border border-blue-100 rounded-xl px-3 py-2 mb-3">Pilih maksimal <b>${maxMulti}</b> jawaban.</div>`:'';let media=q.image_path?`<div class="my-5"><img src="${esc(q.image_path)}" class="max-h-80 max-w-full mx-auto rounded-2xl border object-contain" alt="Gambar soal" onerror="this.style.display='none'"></div>`:'';$('studentContent').innerHTML=`<div class="card p-5"><div class="flex flex-wrap justify-between gap-2"><div><b>Soal ${idx+1}/${exam.questions.length}</b><div class="text-xs text-slate-500 mt-1">${isAnswered(q)?'Sudah dijawab':'Belum dijawab'}</div></div><span class="text-xs px-2 py-1 rounded-full bg-slate-100">${esc(q.type==='single'?'Single Choice':q.type==='multi'?'Multi Select':'Benar/Salah')}</span></div><div class="text-lg my-6 whitespace-pre-wrap">${esc(q.text)}</div>${media}${hint}<div class="grid gap-3">${os}</div><div class="flex flex-wrap justify-between gap-2 mt-6"><button onclick="prev()" ${idx===0?'disabled':''} class="px-4 py-2 bg-slate-200 rounded-xl disabled:opacity-40">Sebelumnya</button><div class="flex gap-2">${idx<exam.questions.length-1?`<button onclick="next()" class="px-4 py-2 bg-blue-600 text-white rounded-xl">Berikutnya</button>`:''}${idx===exam.questions.length-1?'<button onclick="submit(false)" class="px-4 py-2 bg-emerald-600 text-white rounded-xl">Selesai</button>':''}</div></div>${renderQuestionNavigator()}</div>`}
async function persistAnswers(){if(!exam?.attempt_id)return;await api('/api/exams/'+exam.attempt_id+'/save',{method:'POST',body:JSON.stringify({answers:ans})})}
async function saveEssayAndNext(){const q=exam.questions[idx],el=$('essayAnswer');ans[q.id]=el?.value||'';try{await persistAnswers();if(idx<exam.questions.length-1){idx++;draw()}}catch(e){if(e.status===423)handleExamViolation('Sesi ujian dikunci oleh sistem/admin');else Swal.fire('Gagal menyimpan',e.message,'error')}}
function pick(i,checked){let q=exam.questions[idx];if(q.type==='multi'){let a=Array.isArray(ans[q.id])?[...ans[q.id].map(Number)]:[];const max=Number(q.correct_count)||1;if(checked){if(a.includes(Number(i)))return;if(a.length>=max){Swal.fire({toast:true,position:'top',icon:'info',title:`Maksimal memilih ${max} jawaban`,showConfirmButton:false,timer:1600});draw();return}a.push(Number(i))}else{a=a.filter(x=>x!==Number(i))}ans[q.id]=a.sort((x,y)=>x-y)}else if(q.type==='single'||q.type==='truefalse'){ans[q.id]=Number(i)}draw()}
async function next(){const q=exam.questions[idx];if(q?.type==='essay'){const el=$('essayAnswer');ans[q.id]=el?.value||''}try{await persistAnswers();if(idx<exam.questions.length-1){idx++;draw()}}catch(e){if(e.status===423)return handleExamViolation('Sesi ujian dikunci oleh sistem/admin');Swal.fire('Gagal menyimpan',e.message,'error')}}
async function prev(){const q=exam.questions[idx];if(q?.type==='essay'){const el=$('essayAnswer');ans[q.id]=el?.value||''}try{await persistAnswers();if(idx>0){idx--;draw()}}catch(e){if(e.status===423)return handleExamViolation('Sesi ujian dikunci oleh sistem/admin');Swal.fire('Gagal menyimpan',e.message,'error')}}
async function handleExamViolation(reason){if(!antiCheatActive||finishDialogOpen||violationBusy||!exam?.attempt_id)return;violationBusy=true;antiCheatActive=false;clearInterval(timer);try{await api('/api/exams/'+exam.attempt_id+'/violation',{method:'POST',body:JSON.stringify({reason})})}catch(e){}document.body.classList.remove('exam-fullscreen');try{if(document.fullscreenElement)await document.exitFullscreen()}catch(e){}await Swal.fire({icon:'error',title:'Pelanggaran Terdeteksi',text:'Anda terdeteksi membuka aplikasi/tab lain atau keluar dari mode ujian. Sesi ujian dihentikan dan login dikunci. Hubungi admin untuk mengaktifkan kembali.',confirmButtonText:'Kembali ke Login'});location.reload()}
function setupAntiCheat(){document.addEventListener('visibilitychange',()=>{if(antiCheatActive&&!finishDialogOpen&&document.hidden)handleExamViolation('Terdeteksi berpindah tab/aplikasi atau halaman ujian menjadi tidak aktif')});window.addEventListener('blur',()=>{if(antiCheatActive&&!finishDialogOpen&&document.hidden)handleExamViolation('Terdeteksi halaman ujian kehilangan fokus karena berpindah aplikasi/tab')});document.addEventListener('fullscreenchange',()=>{if(antiCheatActive&&!finishDialogOpen&&!document.fullscreenElement)handleExamViolation('Terdeteksi keluar dari mode layar penuh')});window.addEventListener('beforeunload',()=>{if(antiCheatActive&&!finishDialogOpen&&exam?.attempt_id&&!violationBusy){try{const blob=new Blob([JSON.stringify({reason:'Halaman ujian ditutup/dimuat ulang saat ujian berlangsung'})],{type:'application/json'});navigator.sendBeacon('/api/exams/'+exam.attempt_id+'/violation',blob)}catch(e){}}});document.addEventListener('keydown',e=>{if(!antiCheatActive||finishDialogOpen)return;if(e.key==='F12'||(e.ctrlKey&&e.shiftKey&&['I','J','C'].includes(e.key.toUpperCase()))||(e.ctrlKey&&['U','S'].includes(e.key.toUpperCase()))){e.preventDefault();e.stopPropagation();Swal.fire({toast:true,position:'top',icon:'warning',title:'Fitur ini dinonaktifkan saat ujian',showConfirmButton:false,timer:1400})}})}
setupAntiCheat();
async function submit(auto){
 if(auto){await finishExam();return}
 const total=exam?.questions?.length||0;
 const answered=exam?.questions?.filter(isAnswered).length||0;
 const unanswered=Math.max(0,total-answered);
 finishDialogOpen=true;
 const result=await Swal.fire({
   icon:'question',
   title:'Selesaikan Ujian?',
   html:`<div style="text-align:left;margin:8px 0 0">
     <div style="font-size:15px;color:#475569;margin-bottom:14px">Pastikan semua jawaban sudah diperiksa sebelum mengakhiri ujian.</div>
     <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px">
       <div style="padding:12px;border-radius:12px;background:#eff6ff;text-align:center"><div style="font-size:12px;color:#64748b">Total Soal</div><b style="font-size:20px;color:#1d4ed8">${total}</b></div>
       <div style="padding:12px;border-radius:12px;background:#f0fdf4;text-align:center"><div style="font-size:12px;color:#64748b">Terjawab</div><b style="font-size:20px;color:#15803d">${answered}</b></div>

async function importFile(input,url,refresh){
 const file=input?.files?.[0];
 if(!file)return;
 const allowed=['.xlsx','.xls','.csv'];
 const ext=(file.name.match(/\.[^.]+$/)||[''])[0].toLowerCase();
 if(!allowed.includes(ext)){input.value='';return Swal.fire('Format tidak didukung','Gunakan file Excel (.xlsx/.xls) atau CSV (.csv).','warning');}
 if(file.size>10*1024*1024){input.value='';return Swal.fire('File terlalu besar','Maksimal ukuran file import 10 MB.','warning');}
 const fd=new FormData();fd.append('file',file);
 try{
  Swal.fire({title:'Mengimpor data...',text:'Mohon tunggu.',allowOutsideClick:false,didOpen:()=>Swal.showLoading()});
  const r=await fetch(url,{method:'POST',body:fd});
  let d={};try{d=await r.json()}catch{}
  if(!r.ok){
   const details=Array.isArray(d.details)?'\n\n'+d.details.join('\n'):'';
   throw Error((d.error||'Import gagal')+details);
  }
  Swal.close();
  await Swal.fire('Import berhasil',`${d.imported||0} data berhasil diimpor.`,'success');
  input.value='';
  if(refresh==='students')students();
  else if(refresh==='questions')questions();
  else if(refresh==='gurus')gurus();
 }catch(e){
  Swal.close();
  input.value='';
  Swal.fire('Import gagal',String(e.message||e),'error');
 }
}

async function cards(){const [classes,cfg]=await Promise.all([api('/api/classes'),api('/api/config')]);window.cardConfig=cfg;$('staffContent').innerHTML=`<div class="card p-5"><div class="flex flex-wrap justify-between items-center gap-3"><div><h2 class="font-bold text-xl">Kartu Peserta Ujian</h2><p class="text-sm text-slate-500">Pilih siswa lalu cetak <b>6 kartu per kertas A4</b> dengan desain mengikuti kartu contoh.</p></div><button onclick="cards()" class="px-3 py-2 rounded-xl bg-slate-100">Refresh</button></div><div class="grid md:grid-cols-4 gap-2 mt-4"><select id="cardClass" class="border rounded-xl p-3" onchange="loadCardStudents()"><option value="">-- Semua Kelas --</option>${classes.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('')}</select><input id="cardExamType" class="border rounded-xl p-3" value="${esc(cfg.card_exam_type||'UJIAN SEMESTER') }" placeholder="Jenis Ujian"><input id="cardExamDate" class="border rounded-xl p-3" value="${esc(cfg.card_exam_date||'') }" placeholder="Tanggal Ujian"><input id="cardUrl" class="border rounded-xl p-3" value="${esc(cfg.card_login_url||location.origin)}" placeholder="Alamat Login / Link Ujian"></div><div class="mt-3 flex flex-wrap gap-2"><button onclick="generateCardPasswords()" class="px-3 py-2 rounded-xl bg-amber-500 text-white">Buat/Reset Password Kartu</button><button onclick="printLoginCards()" class="px-3 py-2 rounded-xl bg-blue-600 text-white">Cetak 6 Kartu / A4</button><button onclick="saveCardConfig()" class="px-3 py-2 rounded-xl bg-emerald-600 text-white">Simpan Pengaturan</button></div><div id="cardStudents" class="mt-5 overflow-auto"></div></div><div class="card p-5 mt-5"><h3 class="font-bold">Pengaturan Kartu Peserta</h3><div class="grid md:grid-cols-2 gap-3 mt-3"><input id="cardHeader1" class="border rounded-xl p-3" value="${esc(cfg.card_header1||'KARTU PESERTA UJIAN SEMESTER GENAP')}" placeholder="Judul kartu"><input id="cardHeader2" class="border rounded-xl p-3" value="${esc(cfg.card_header2||cfg.school_name||'')}" placeholder="Nama sekolah"><input id="cardHeader3" class="border rounded-xl p-3" value="${esc(cfg.card_header3||'TAHUN PELAJARAN 2025/2026')}" placeholder="Tahun pelajaran"><input id="cardAddress" class="border rounded-xl p-3" value="${esc(cfg.card_address||'')}" placeholder="Alamat sekolah (opsional)"><input id="cardHeadName" class="border rounded-xl p-3" value="${esc(cfg.card_head_name||'')}" placeholder="Nama Kepala Sekolah"><input id="cardHeadNip" class="border rounded-xl p-3" value="${esc(cfg.card_head_nip||'')}" placeholder="NIP Kepala Sekolah"><input id="cardSignPlaceDate" class="border rounded-xl p-3" value="${esc(cfg.card_sign_place_date||'')}" placeholder="Tempat, tanggal (contoh: Oelnasi, 02 Juni 2026)"></div><div class="grid md:grid-cols-3 gap-3 mt-3"><div><label class="text-sm font-semibold">Logo Sekolah (maks 200 KB)</label><input id="cardLogo" type="file" accept="image/png,image/jpeg,image/webp" class="w-full border rounded-xl p-2 mt-1" onchange="uploadCardImage(this,'card_logo')"><div id="logoPreview" class="text-xs text-slate-500 mt-1">${cfg.card_logo?'Sudah tersimpan':'Belum ada'}</div></div><div><label class="text-sm font-semibold">Tanda tangan Kepala Sekolah (maks 200 KB)</label><input id="cardSignature" type="file" accept="image/png,image/jpeg,image/webp" class="w-full border rounded-xl p-2 mt-1" onchange="uploadCardImage(this,'card_signature')"><div id="sigPreview" class="text-xs text-slate-500 mt-1">${cfg.card_signature?'Sudah tersimpan':'Belum ada'}</div></div><div><label class="text-sm font-semibold">Cap Sekolah (maks 200 KB)</label><input id="cardStamp" type="file" accept="image/png,image/jpeg,image/webp" class="w-full border rounded-xl p-2 mt-1" onchange="uploadCardImage(this,'card_stamp')"><div id="stampPreview" class="text-xs text-slate-500 mt-1">${cfg.card_stamp?'Sudah tersimpan':'Belum ada'}</div></div></div><p class="text-xs text-slate-500 mt-3">Format kartu mengikuti contoh: logo di kiri, kop 3 baris, identitas Nama Peserta/Kelas/NIPD/NISN, area tanda tangan & cap, serta QR Link Ujian.</p></div>`;await loadCardStudents()}
async function loadCardStudents(){const cls=$('cardClass')?.value||'';let rows=await api('/api/cards/students'+(cls?'?class_name='+encodeURIComponent(cls):''));window.cardStudents=rows;$('cardStudents').innerHTML=`<table class="w-full text-sm"><thead><tr class="border-b"><th class="p-2"><input type="checkbox" onchange="document.querySelectorAll('.cardcheck').forEach(x=>x.checked=this.checked)"></th><th class="text-left p-2">Nama</th><th>Kelas</th><th>NIPD</th><th>NISN</th><th>Username</th><th>Password Kartu</th></tr></thead><tbody>${rows.map(x=>`<tr class="border-b"><td class="p-2"><input type="checkbox" class="cardcheck" value="${x.id}"></td><td class="p-2">${esc(x.name)}</td><td>${esc(x.class_name||'-')}</td><td>${esc(x.nipd||'-')}</td><td>${esc(x.nisn||'-')}</td><td>${esc(x.username)}</td><td>${x.password?`<b>${esc(x.password)}</b>`:'<span class="text-red-600">Belum dibuat</span>'}</td></tr>`).join('')}</tbody></table>`}
async function generateCardPasswords(){const ids=[...document.querySelectorAll('.cardcheck:checked')].map(x=>Number(x.value));if(!ids.length)return Swal.fire('Pilih siswa','','info');const ok=await Swal.fire({icon:'warning',title:'Buat/Reset password kartu?',text:'Password login siswa yang dipilih akan diganti dan dapat dicetak pada kartu.',showCancelButton:true,confirmButtonText:'Ya, buat password',cancelButtonText:'Batal'});if(!ok.isConfirmed)return;try{await api('/api/cards/generate-passwords',{method:'POST',body:JSON.stringify({ids})});await loadCardStudents();Swal.fire('Berhasil','Password kartu berhasil dibuat.','success')}catch(e){Swal.fire('Gagal',e.message,'error')}}
async function saveCardConfig(){try{await api('/api/settings',{method:'POST',body:JSON.stringify({card_exam_type:$('cardExamType').value,card_exam_date:$('cardExamDate').value,card_login_url:$('cardUrl').value,card_header1:$('cardHeader1').value,card_header2:$('cardHeader2').value,card_header3:$('cardHeader3').value,card_address:$('cardAddress').value,card_head_name:$('cardHeadName').value,card_head_nip:$('cardHeadNip').value,card_sign_place_date:$('cardSignPlaceDate').value})});Swal.fire('Tersimpan','Pengaturan kartu peserta tersimpan.','success')}catch(e){Swal.fire('Gagal',e.message,'error')}}
async function uploadCardImage(input,key){if(!input.files?.[0])return;if(input.files[0].size>1024*1024)return Swal.fire('Gambar terlalu besar','Maksimal 200 KB per gambar.','warning');const fd=new FormData();fd.append('image',input.files[0]);try{const r=await fetch('/api/cards/image',{method:'POST',body:fd});const d=await r.json();if(!r.ok)throw Error(d.error||'Upload gagal');await api('/api/settings',{method:'POST',body:JSON.stringify({[key]:d.url})});window.cardConfig=window.cardConfig||{};window.cardConfig[key]=d.url;if(key==='card_logo')$('logoPreview').innerHTML='<span class="text-emerald-600">Tersimpan</span>';if(key==='card_signature')$('sigPreview').innerHTML='<span class="text-emerald-600">Tersimpan</span>';if(key==='card_stamp')$('stampPreview').innerHTML='<span class="text-emerald-600">Tersimpan</span>'}catch(e){Swal.fire('Gagal',e.message,'error')}}
async function printLoginCards(){
  const ids=[...document.querySelectorAll('.cardcheck:checked')].map(x=>Number(x.value));
  if(!ids.length)return Swal.fire('Pilih siswa','','info');
  const selected=(window.cardStudents||[]).filter(x=>ids.includes(Number(x.id)));
  const base=window.cardConfig||{};
  const cfg={url:$('cardUrl').value||location.origin,h1:$('cardHeader1').value,h2:$('cardHeader2').value,h3:$('cardHeader3').value,address:$('cardAddress').value,head:$('cardHeadName').value,nip:$('cardHeadNip').value,signDate:$('cardSignPlaceDate').value,logo:base.card_logo||'',signature:base.card_signature||'',stamp:base.card_stamp||''};
  if(!cfg.url.trim())return Swal.fire('Link ujian belum diisi','Isi alamat login/link ujian terlebih dahulu.','warning');
  const oldPrint=document.getElementById('cbtPrintArea'); if(oldPrint)oldPrint.remove();
  const oldStyle=document.getElementById('cbtPrintStyle'); if(oldStyle)oldStyle.remove();
  const area=document.createElement('div'); area.id='cbtPrintArea'; area.className='print-area';
  const style=document.createElement('style'); style.id='cbtPrintStyle';
  style.textContent=`.print-area{display:none}@media print{body>*:not(#cbtPrintArea){display:none!important}#cbtPrintArea{display:block!important;position:static!important}@page{size:A4 portrait;margin:7mm}#cbtPrintArea *{box-sizing:border-box}#cbtPrintArea .page{width:196mm;height:283mm;display:grid;grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(3,1fr);gap:4mm;page-break-after:always}#cbtPrintArea .page:last-child{page-break-after:auto}#cbtPrintArea .card{width:96mm;height:91.6mm;border:1px solid #111;padding:3.2mm;position:relative;overflow:hidden;background:#fff;font-family:Arial,sans-serif;color:#111}#cbtPrintArea .head{height:22mm;border-bottom:1px solid #111;display:grid;grid-template-columns:16mm 1fr;align-items:center}#cbtPrintArea .logo{width:14mm;height:14mm;object-fit:contain}#cbtPrintArea .headtext{text-align:center;line-height:1.18;padding-right:2mm}#cbtPrintArea .h1{font-size:10px;font-weight:800}#cbtPrintArea .h2{font-size:9px;font-weight:700;margin-top:1mm}#cbtPrintArea .h3{font-size:8px;font-weight:700;margin-top:1mm}#cbtPrintArea .addr{font-size:6px}#cbtPrintArea .body{height:52mm;padding-top:2.5mm;display:grid;grid-template-columns:1fr 34mm;gap:2mm}#cbtPrintArea .info{font-size:8px;padding-top:1mm}#cbtPrintArea .info p{margin:1.7mm 0;display:grid;grid-template-columns:27mm 1fr}#cbtPrintArea .info .value{font-weight:500;word-break:break-word}#cbtPrintArea .qrbox{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:1mm}#cbtPrintArea .qrbox img{width:28mm;height:28mm;object-fit:contain;border:1px solid #bbb}#cbtPrintArea .qrtitle{font-size:7px;font-weight:800;margin-top:1.5mm;text-align:center}#cbtPrintArea .qrhint{font-size:5.5px;text-align:center;line-height:1.2;margin-top:1mm}#cbtPrintArea .qrurl{font-size:5.2px;text-align:center;line-height:1.15;margin-top:1mm;word-break:break-all;overflow-wrap:anywhere}#cbtPrintArea .sign{position:absolute;right:4mm;bottom:3mm;width:38mm;text-align:center;font-size:6.2px;line-height:1.2}#cbtPrintArea .sign img{max-width:17mm;max-height:8mm;object-fit:contain;margin:0 auto .5mm}#cbtPrintArea .stamp{position:absolute;left:37mm;bottom:5mm;width:16mm;height:16mm;object-fit:contain;opacity:.78}#cbtPrintArea .footer{position:absolute;left:4mm;bottom:3mm;font-size:5.2px}}`;
  document.head.appendChild(style); document.body.appendChild(area);
  const escHtml=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;').replace(/'/g,'&#39;');
  Swal.fire({title:'Menyiapkan kartu...',text:`Membuat ${selected.length} kartu peserta.`,allowOutsideClick:false,didOpen:()=>Swal.showLoading()});
  const qrResults=await Promise.all(selected.map(async x=>{try{const r=await fetch('/api/cards/qr?text='+encodeURIComponent(cfg.url));if(!r.ok)throw Error('QR gagal dibuat');return await r.text()}catch(e){return ''}}));
  const qrById=new Map(selected.map((x,i)=>[x.id,qrResults[i]])); const chunks=[]; for(let i=0;i<selected.length;i+=6)chunks.push(selected.slice(i,i+6));
  area.innerHTML=chunks.map(chunk=>`<section class="page">${chunk.map(x=>{const qr=qrById.get(x.id)||'';return `<div class="card"><div class="head">${cfg.logo?`<img class="logo" src="${escHtml(cfg.logo)}" alt="Logo">`:'<div></div>'}<div class="headtext"><div class="h1">${escHtml(cfg.h1)}</div><div class="h2">${escHtml(cfg.h2)}</div><div class="h3">${escHtml(cfg.h3)}</div>${cfg.address?`<div class="addr">${escHtml(cfg.address)}</div>`:''}</div></div><div class="body"><div class="info"><p><span class="label">Nama Peserta</span><span class="value">: ${escHtml(x.name)}</span></p><p><span class="label">Kelas</span><span class="value">: ${escHtml(x.class_name||'-')}</span></p><p><span class="label">NIPD</span><span class="value">: ${escHtml(x.nipd||'-')}</span></p><p><span class="label">NISN</span><span class="value">: ${escHtml(x.nisn||'-')}</span></p><p><span class="label">Username</span><span class="value">: ${escHtml(x.username||'-')}</span></p><p><span class="label">Password</span><span class="value"><b>: ${escHtml(x.password||'-')}</b></span></p></div><div class="qrbox">${qr?`<div style="width:28mm;height:28mm">${qr}</div>`:''}<div class="qrtitle">LINK UJIAN</div><div class="qrhint">Scan QR / ketik alamat di bawah</div><div class="qrurl">${escHtml(cfg.url)}</div></div></div>${cfg.stamp?`<img class="stamp" src="${escHtml(cfg.stamp)}" alt="Cap">`:''}<div class="sign">${cfg.signDate?`<div>${escHtml(cfg.signDate)}</div>`:''}<div>Kepala Sekolah</div>${cfg.signature?`<img src="${escHtml(cfg.signature)}" alt="Tanda tangan">`:''}<div><b>${escHtml(cfg.head)}</b></div><div>NIP. ${escHtml(cfg.nip)}</div></div><div class="footer">${escHtml($('cardExamType').value||'Kartu Peserta Ujian')}</div></div>`}).join('')}</section>`).join('');
  Swal.close(); const images=[...area.querySelectorAll('img')]; await Promise.all(images.map(img=>new Promise(resolve=>{if(img.complete)return resolve();img.onload=resolve;img.onerror=resolve})));
  const cleanup=()=>{area.remove();style.remove();window.removeEventListener('afterprint',cleanup)}; window.addEventListener('afterprint',cleanup); window.scrollTo(0,0); setTimeout(()=>window.print(),250);
}
async function gurus(){let s=await api('/api/staff');let rows=s.filter(x=>x.role==='guru');$('staffContent').innerHTML=staffManager('Guru','guru',rows,'/api/templates/teachers','/api/import/staff')}
async function admins(){let s=await api('/api/staff');let rows=s.filter(x=>x.role==='admin');$('staffContent').innerHTML=staffManager('Admin','admin',rows,null,null)}
function staffManager(title,role,rows,template,importUrl){return `<div class="card p-5"><div class="flex flex-wrap justify-between gap-2"><h2 class="font-bold text-xl">Menu ${title}</h2><div>${template?`<a href="${template}" class="px-3 py-2 rounded-xl bg-slate-700 text-white inline-block">Template Data Guru</a><label class="ml-2 px-3 py-2 rounded-xl bg-emerald-600 text-white cursor-pointer inline-block">Import Data Guru<input type="file" class="hidden" accept=".xlsx,.xls,.csv" onchange="importFile(this,'${importUrl}','gurus')"></label>`:''}</div></div><div class="grid md:grid-cols-4 gap-2 mt-4"><input id="st_user" class="border rounded-xl p-3" placeholder="Username"><div class="password-wrap"><input id="st_pass" type="password" class="w-full border rounded-xl p-3" placeholder="Password"><button type="button" class="password-toggle" onclick="togglePassword('st_pass','eyeStaff')"><span id="eyeStaff">👁️</span></button></div><input id="st_name" class="border rounded-xl p-3" placeholder="Nama"><select id="st_active" class="border rounded-xl p-3"><option value="1">Aktif</option><option value="0">Nonaktif</option></select></div><button onclick="addStaff('${role}')" class="mt-3 bg-blue-600 text-white rounded-xl px-4 py-2">Tambah ${title}</button></div><div class="card p-5 mt-5 overflow-auto"><table class="w-full text-sm"><thead><tr class="border-b"><th class="text-left p-2">Nama</th><th>Username</th><th>Status</th><th>Aksi</th></tr></thead><tbody>${rows.map(x=>`<tr class="border-b"><td class="p-2">${esc(x.name)}</td><td>${esc(x.username)}</td><td>${x.active?'Aktif':'Nonaktif'}</td><td><button class="text-blue-600" onclick='editStaff(${JSON.stringify(x)})'>Edit</button> <button class="danger ml-2" onclick="deleteStaff(${x.id},'${role}')">Hapus</button></td></tr>`).join('')}</tbody></table></div>`}
async function addStaff(role){try{await api('/api/staff',{method:'POST',body:JSON.stringify({username:$('st_user').value,password:$('st_pass').value,name:$('st_name').value,role,active:$('st_active').value==='1'})});role==='guru'?gurus():admins()}catch(e){Swal.fire('Gagal',e.message,'error')}}
async function editStaff(x){const {value:v}=await Swal.fire({title:'Edit Akun',html:`<input id="ew_user" class="swal2-input" placeholder="Username" value="${esc(x.username)}"><input id="ew_name" class="swal2-input" placeholder="Nama" value="${esc(x.name)}"><input id="ew_pass" type="password" class="swal2-input" placeholder="Password baru (opsional)"><select id="ew_role" class="swal2-select"><option value="guru" ${x.role==='guru'?'selected':''}>Guru</option><option value="admin" ${x.role==='admin'?'selected':''}>Admin</option></select><label><input id="ew_active" type="checkbox" ${x.active?'checked':''}> Aktif</label>`,showCancelButton:true,preConfirm:()=>({username:$('ew_user').value,name:$('ew_name').value,password:$('ew_pass').value,role:$('ew_role').value,active:$('ew_active').checked})});if(!v)return;try{await api('/api/staff/'+x.id,{method:'PUT',body:JSON.stringify(v)});v.role==='guru'?gurus():admins()}catch(e){Swal.fire('Gagal',e.message,'error')}}
async function deleteStaff(id,role){if(!confirm('Hapus akun ini?'))return;try{await api('/api/staff/'+id,{method:'DELETE'});role==='guru'?gurus():admins()}catch(e){Swal.fire('Gagal',e.message,'error')}}
async function downloadBackup(){try{const r=await fetch('/api/admin/backup');if(!r.ok){let d={};try{d=await r.json()}catch{}throw Error(d.error||'Backup gagal')}const blob=await r.blob();const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='CBTVEN_backup.sqlite';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);Swal.fire('Backup dimulai','Simpan file backup di lokasi aman di luar server.','success')}catch(e){Swal.fire('Backup gagal',e.message,'error')}}
async function restoreBackup(input){const file=input.files?.[0];if(!file)return;if(!/\.(sqlite|db)$/i.test(file.name)){input.value='';return Swal.fire('Format tidak sesuai','Pilih file backup .sqlite atau .db.','warning')}const confirm=await Swal.fire({icon:'warning',title:'Pulihkan database?',html:'Data yang ada sekarang akan diganti dengan isi backup. Server akan membuat backup pengaman otomatis sebelum pemulihan. Pastikan file yang dipilih benar.',showCancelButton:true,confirmButtonText:'Ya, pulihkan database',cancelButtonText:'Batal',confirmButtonColor:'#b91c1c'});if(!confirm.isConfirmed){input.value='';return}const fd=new FormData();fd.append('backup',file);try{Swal.fire({title:'Memulihkan database...',text:'Jangan tutup halaman sampai proses selesai.',allowOutsideClick:false,didOpen:()=>Swal.showLoading()});const r=await fetch('/api/admin/restore',{method:'POST',body:fd});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||'Restore gagal');await Swal.fire('Restore berhasil',d.message||'Database dipulihkan. Jalankan ulang aplikasi jika diperlukan.','success');}catch(e){Swal.fire('Restore gagal',e.message,'error')}finally{input.value=''}}
async function settings(){let c=await api('/api/config');$('staffContent').innerHTML=`<div class="card p-5 max-w-3xl"><h2 class="font-bold text-xl">Identitas Sekolah</h2><input id="is" value="${esc(c.school_name)}" class="w-full border rounded-xl p-3 mt-3" placeholder="Nama sekolah"><input id="ia" value="${esc(c.app_name)}" class="w-full border rounded-xl p-3 mt-3" placeholder="Nama aplikasi"><input id="il" value="${esc(c.logo_text)}" class="w-full border rounded-xl p-3 mt-3" placeholder="Logo/text"><div class="mt-5 p-4 bg-slate-50 rounded-xl"><b>Pengaturan Kartu Login</b><div class="grid md:grid-cols-2 gap-2 mt-3"><input id="setExamType" value="${esc(c.card_exam_type||'')}" class="border rounded-xl p-3" placeholder="Jenis ujian"><input id="setExamDate" value="${esc(c.card_exam_date||'')}" class="border rounded-xl p-3" placeholder="Tanggal ujian"><input id="setLoginUrl" value="${esc(c.card_login_url||location.origin)}" class="border rounded-xl p-3" placeholder="Alamat login siswa"><input id="setHeadName" value="${esc(c.card_head_name||'')}" class="border rounded-xl p-3" placeholder="Kepala Sekolah"><input id="setHeadNip" value="${esc(c.card_head_nip||'')}" class="border rounded-xl p-3" placeholder="NIP"></div></div><button onclick="saveSettings()" class="mt-3 bg-blue-600 text-white rounded-xl px-4 py-2">Simpan</button><button onclick="downloadBackup()" class="mt-3 ml-2 bg-emerald-600 text-white rounded-xl px-4 py-2">Backup Database (.sqlite)</button><label class="mt-3 ml-2 bg-amber-600 text-white rounded-xl px-4 py-2 inline-block cursor-pointer">Restore Database<input type="file" accept=".sqlite,.db" class="hidden" onchange="restoreBackup(this)"></label><p class="text-xs text-slate-500 mt-2">Backup: unduh salinan database. Restore: mengganti database aktif dari file backup. Sebelum restore, sistem membuat backup pengaman otomatis; server akan restart setelah pemulihan.</p></div>`}

async function saveSettings(){await api('/api/settings',{method:'POST',body:JSON.stringify({school_name:$('is').value,app_name:$('ia').value,logo_text:$('il').value,card_exam_type:$('setExamType')?.value,card_exam_date:$('setExamDate')?.value,card_login_url:$('setLoginUrl')?.value,card_head_name:$('setHeadName')?.value,card_head_nip:$('setHeadNip')?.value})});boot();Swal.fire('Tersimpan','','success')}
async function del(u,refresh){if(!confirm('Hapus data ini?'))return;try{await api(u,{method:'DELETE'});({dash,schedule,questions,students,subjects,results,cards,gurus,admins}[refresh]||dash)()}catch(e){Swal.fire('Gagal',e.message,'error')}}
boot();
</script></body></html>
